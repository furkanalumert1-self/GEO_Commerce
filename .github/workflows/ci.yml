name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_USER: geo, POSTGRES_PASSWORD: geo, POSTGRES_DB: geo_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U geo" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://geo:geo@localhost:5432/geo_test
      TEST_DATABASE_URL: postgresql://geo:geo@localhost:5432/geo_test
      AUTH_SECRET: ci-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
